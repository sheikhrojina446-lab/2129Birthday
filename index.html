<!DOCTYPE html>
<html>
<head><title>Happy Birthday Samir 🎂</title><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#160b2b;font-family:Georgia, serif;overflow:hidden}
.sky{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%, #2e1a4d 0%, #1a102e 50%, #110725 100%);}
#lock{position:fixed;inset:0;z-index:100;background:#160b2b;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:20px;text-align:center}
#lock h2{color:#ffd6ec;font-size:28px;font-style:italic;margin-bottom:15px}
#lock p{color:#d8cbe8;font-size:13px;margin-bottom:20px;letter-spacing:1px}
#lock input{padding:12px 20px;border-radius:25px;border:1px solid #ff5c9a;background:rgba(255,255,255,0.08);color:white;outline:none;text-align:center;width:220px;font-size:16px;letter-spacing:2px}
#lock button{margin-top:15px;padding:10px 30px;border-radius:25px;border:none;background:#ff5c9a;color:white;cursor:pointer;font-size:14px}
#err{color:#ff7fb0;margin-top:10px;font-size:12px;display:none}
.page{display:none;position:relative;z-index:10;min-height:100vh;padding:50px 20px;text-align:center}
h1{font-size:42px;color:#ffd6ec;font-style:italic}
</style>
</head>
<body>
<div class="sky"></div>

<div id="lock">
<h2>🔒 Private Surprise For Samir</h2>
<p>ENTER SECRET CODE TO UNLOCK</p>
<input type="password" id="pwd" placeholder="Enter Password">
<button onclick="check()">Unlock 💗</button>
<div id="err">Wrong password! Try again</div>
</div>

<div class="page" id="mainPage">
<h1 style="color:#ffd6ec;font-size:42px;font-style:italic;margin-top:20vh">Happy Birthday<br/>Samir 🎂</h1>
<p style="color:#e9a4c4;margin-top:15px">A special surprise is waiting for you...</p>
<a href="ourstory.html" style="display:inline-block;margin-top:30px;padding:12px 35px;border:1px solid #ff5c9a;border-radius:25px;background:rgba(255,92,154,0.15);color:#ffc2d9;text-decoration:none">Open Your Surprise →</a>
</div>

<script>
function check(){
  let p=document.getElementById('pwd').value;
  if(p==="RS2921"){
    document.getElementById('lock').style.display='none';
    document.getElementById('mainPage').style.display='block';
    document.body.style.overflow='auto';
  }else{
    document.getElementById('err').style.display='block';
  }
}
document.getElementById('pwd').addEventListener('keypress', function(e){ if(e.key==='Enter'){ check(); } });
</script>

<!-- Background Stars Code from original -->
<script>
for(let i=0;i<300;i++){let s=document.createElement('div');s.style.position='fixed';s.style.background='white';s.style.borderRadius='50%';s.style.top=Math.random()*100+'%';s.style.left=Math.random()*100+'%';s.style.width=(Math.random()*2+0.5)+'px';s.style.height=s.style.width;s.style.opacity=Math.random();document.body.appendChild(s);}
</script>
</body>
</html>
